  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: #070a12;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px;
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    .header-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 900;
      font-size: 1.2rem;
      color: #38ef7d;
      letter-spacing: -0.5px;
    }

    .brand-logo span {
      color: #0088ff;
    }

    .signal-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      background: rgba(56, 239, 125, 0.15);
      border: 1px solid rgba(56, 239, 125, 0.3);
      color: #38ef7d;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: #38ef7d;
      border-radius: 50%;
      box-shadow: 0 0 8px #38ef7d;
      animation: blink 1.2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    /* Game Stadium Stage */
    .stadium-container {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(180deg, #0b0f19 0%, #050811 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px 10px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    /* 1win Authentic Goal Frame */
    .goal-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      border-radius: 10px;
      border: 3px solid #e2e8f0;
      box-shadow: 0 0 15px rgba(226, 232, 240, 0.2), inset 0 0 20px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Goal Net Mesh Background */
    .net-mesh {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 12px 12px;
      z-index: 1;
    }

    /* Center 1win Blue Stripe */
    .blue-stripe {
      position: absolute;
      width: 100%;
      height: 33.33%;
      top: 33.33%;
      left: 0;
      background: rgba(0, 102, 255, 0.35);
      border-top: 1px solid rgba(0, 136, 255, 0.5);
      border-bottom: 1px solid rgba(0, 136, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 2;
      pointer-events: none;
    }

    .stripe-logo {
      font-size: 0.85rem;
      font-weight: 900;
      font-style: italic;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 1px;
    }

    /* 5x3 Target Grid Matrix */
    .target-grid {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
      padding: 6px;
      z-index: 4;
    }

    .target-spot {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .target-circle {
      width: 38px;
      height: 38px;
      border: 2px dashed rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
    }

    .target-circle::after {
      content: '';
      width: 12px;
      height: 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
    }

    /* Safe Target Prediction Styling */
    .target-spot.safe .target-circle {
      border: 2px solid #38ef7d;
      background: rgba(56, 239, 125, 0.25);
      box-shadow: 0 0 14px #38ef7d, inset 0 0 8px #38ef7d;
      animation: pulse-target 1s infinite alternate;
    }

    .target-spot.safe .target-circle::after {
      background: #38ef7d;
      border-color: #38ef7d;
      box-shadow: 0 0 6px #38ef7d;
    }

    @keyframes pulse-target {
      0% { transform: scale(0.92); }
      100% { transform: scale(1.08); }
    }

    /* Center Goalkeeper Gloves */
    .keeper-gloves {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      z-index: 3;
      filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.8));
      pointer-events: none;
      transition: all 0.4s ease;
    }

    /* Penalty Ball Base Area */
    .ball-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
      position: relative;
    }

    .soccer-ball {
      font-size: 2.2rem;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.9));
      transition: transform 0.3s ease;
    }

    /* Action Trigger Button */
    .predict-btn {
      width: 100%;
      max-width: 480px;
      margin-top: 14px;
      background: linear-gradient(135deg, #0066ff 0%, #0044cc 100%);
      color: #ffffff;
      font-weight: 800;
      font-size: 1.05rem;
      padding: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(0, 102, 255, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .predict-btn:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(0, 102, 255, 0.3);
    }

    /* 1win Affiliate CTA Banner */
    .affiliate-box {
      width: 100%;
      max-width: 480px;
      margin-top: 14px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(56, 239, 125, 0.4);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .affiliate-title {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .affiliate-bonus {
      font-size: 1.25rem;
      font-weight: 900;
      color: #38ef7d;
      margin-bottom: 10px;
    }

    .cta-button {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #38ef7d 0%, #11998e 100%);
      color: #050811;
      font-weight: 900;
      font-size: 1rem;
      padding: 12px;
      border-radius: 10px;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 4px 12px rgba(56, 239, 125, 0.3);
    }

    /* Adsterra Native Banner Placement Slot */
    .adsterra-native-container {
      width: 100%;
      max-width: 480px;
      margin-top: 14px;
      min-height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>

<body>

  <!-- App Header Bar -->
  <div class="header-bar">
    <div class="brand-logo">1win <span>PENALTY AI</span></div>
    <div class="signal-status">
      <div class="pulse-dot"></div>
      ACCURACY 98.4%
    </div>
  </div>

  <!-- Main Game Stadium Arena -->
  <div class="stadium-container">
    <div class="goal-wrapper">
      <div class="net-mesh"></div>
      
      <!-- Middle Blue 1win Band -->
      <div class="blue-stripe">
        <span class="stripe-logo">1win</span>
        <span class="stripe-logo">1win</span>
        <span class="stripe-logo">1win</span>
        <span class="stripe-logo">1win</span>
      </div>

      <!-- Center Goalkeeper Gloves -->
      <div class="keeper-gloves" id="keeper">🧤</div>

      <!-- 5x3 Target Grid -->
      <div class="target-grid" id="grid">
        <!-- 15 Target Spots Generated via JS -->
      </div>
    </div>

    <!-- Penalty Football Base -->
    <div class="ball-stage">
      <div class="soccer-ball" id="ball">⚽</div>
    </div>
  </div>

  <!-- Prediction Button -->
  <button class="predict-btn" onclick="generatePrediction()">
    <span>⚡ GET SAFE PREDICTION</span>
  </button>

  <!-- Adsterra Native Banner Unit (Placement ID: 31962972) -->
  <div class="adsterra-native-container">
    <script async="async" data-cfasync="false" src="https://bauval.org/21/bc4091b3e5d03eadf24be85f7e735c15"></script>
    <div id="container-bc4091b3e5d03eadf24be85f7e735c15"></div>
  </div>

  <!-- 1win Affiliate Monetization Box -->
  <div class="affiliate-box">
    <div class="affiliate-title">OFFICIAL 1WIN SIGNAL SERVER</div>
    <div class="affiliate-bonus">CLAIM +500% WELCOME BONUS</div>
    <a href="https://1win.ng/?p=hjjr" class="cta-button" target="_blank">PLAY NOW ON 1WIN</a>
  </div>

  <!-- ADSTERRA SOCIAL BAR SNIPPET (Placement ID: 31962971) -->
  <script data-cfasync="false" src="https://bauval.org/14/8059e0d9d5ff0fe028c3ebc0f0111a2e"></script>

  <script>
    const grid = document.getElementById('grid');
    const keeper = document.getElementById('keeper');
    const ball = document.getElementById('ball');

    // Build 5x3 Target Cells (15 items total)
    for (let i = 0; i < 15; i++) {
      const spot = document.createElement('div');
      spot.className = 'target-spot';
      spot.id = `spot-${i}`;
      
      const circle = document.createElement('div');
      circle.className = 'target-circle';
      
      spot.appendChild(circle);
      grid.appendChild(spot);
    }

    function generatePrediction() {
      // Clear current highlights
      document.querySelectorAll('.target-spot').forEach(el => el.classList.remove('safe'));
      
      // Animate keeper hands & ball
      keeper.style.transform = 'translate(-50%, -50%) scale(1.2)';
      ball.style.transform = 'scale(0.85) rotate(180deg)';
      
      setTimeout(() => {
        keeper.style.transform = 'translate(-50%, -50%) scale(1)';
        ball.style.transform = 'scale(1) rotate(0deg)';
        
        // Select 3 to 4 random safe target spots
        const spotIndices = Array.from({length: 15}, (_, i) => i);
        const shuffled = spotIndices.sort(() => 0.5 - Math.random());
        const safeSpots = shuffled.slice(0, 4);

        safeSpots.forEach(idx => {
          document.getElementById(`spot-${idx}`).classList.add('safe');
        });
      }, 300);
    }

    // Trigger initial prediction on load
    window.onload = generatePrediction;
  </script>
</body>
