<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penalty Shootout Predictor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 20px;
        }

        /* Top Header Bar */
        .header {
            width: 100%;
            max-width: 440px;
            background-color: #121620;
            border-bottom: 1px solid #1e2638;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-badge {
            background: linear-gradient(90deg, #10b981, #06b6d4);
            color: #ffffff;
            font-weight: 900;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-style: italic;
            margin-right: 6px;
        }

        .brand-title {
            font-weight: 800;
            font-size: 13px;
            color: #e2e8f0;
            letter-spacing: 0.5px;
        }

        .balance-box {
            background-color: #1a202c;
            border: 1px solid #2d3748;
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .currency-select {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 800;
            outline: none;
            cursor: pointer;
        }

        .balance-amount {
            font-weight: 800;
            font-size: 14px;
            color: #34d399;
        }

        /* Main Game Layout */
        .container {
            width: 100%;
            max-width: 440px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Live Predictor Status Bar */
        .status-bar {
            background-color: #151a24;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #cbd5e1;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .confidence-tag {
            background-color: rgba(6, 182, 212, 0.15);
            border: 1px solid #0891b2;
            color: #22d3ee;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Goal & Pitch Arena */
        .pitch-arena {
            position: relative;
            width: 100%;
            height: 260px;
            background: linear-gradient(180deg, #05070a 0%, #0f172a 60%, rgba(6, 78, 59, 0.35) 100%);
            border: 2px solid #1e293b;
            border-radius: 16px;
            overflow: hidden;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Matchup Header */
        .matchup-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .badge-ai {
            background: #059669;
            color: #fff;
            font-weight: 900;
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 4px;
            font-style: italic;
        }

        .vs-tag {
            color: #eab308;
            font-weight: 900;
            font-size: 11px;
        }

        .flag-tag {
            font-size: 16px;
            background-color: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Goal Net & Frame */
        .goal-frame {
            position: relative;
            width: 95%;
            height: 150px;
            border-top: 5px solid #f8fafc;
            border-left: 5px solid #f8fafc;
            border-right: 5px solid #f8fafc;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.12) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: 14px 14px;
        }

        /* 3x5 Interactive Target Grid */
        .grid-3x5 {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 3px;
            padding: 3px;
            position: relative;
            z-index: 10;
        }

        .target-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 4px;
            color: #38bdf8;
            font-size: 9px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .target-btn:hover, .target-btn:active {
            background: rgba(56, 189, 248, 0.25);
            border-color: #38bdf8;
            transform: scale(1.04);
        }

        /* Goalkeeper Model */
        .keeper {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 46px;
            height: 56px;
            z-index: 5;
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .keeper-gloves {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 2px;
        }

        .keeper-body {
            width: 30px;
            height: 34px;
            background: linear-gradient(180deg, #059669, #064e3b);
            border: 1px solid #34d399;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 11px;
            color: #ffffff;
        }

        /* Ball Area */
        .ball-area {
            position: relative;
            width: 100%;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .football {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 28px;
            background: #ffffff;
            border-radius: 50%;
            border: 2px solid #000;
            z-index: 20;
            transition: all 0.45s cubic-bezier(0.1, 0.8, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #000;
            box-shadow: 0 6px 12px rgba(0,0,0,0.7);
        }

        /* Multipliers Controls */
        .mult-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .mult-card {
            background-color: #161c28;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mult-card.active {
            background: linear-gradient(180deg, #065f46, #064e3b);
            border: 2px solid #34d399;
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.3);
        }

        .mult-label {
            font-size: 9px;
            color: #94a3b8;
            font-weight: 700;
        }

        .mult-val {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
        }

        /* Bet Controls Panel */
        .bet-box {
            background-color: #151a24;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bet-input-row {
            display: flex;
            gap: 6px;
        }

        .input-wrapper {
            flex-grow: 1;
            background-color: #0b0e14;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .bet-input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 15px;
            width: 80px;
        }

        .btn-quick {
            background-color: #1e2638;
            border: 1px solid #334155;
            color: #ffffff;
            font-weight: 700;
            font-size: 11px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-shoot {
            background: linear-gradient(90deg, #059669, #06b6d4);
            border: none;
            color: #ffffff;
            font-weight: 800;
            font-size: 15px;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.4);
            width: 100%;
        }

        .btn-shoot:active {
            transform: scale(0.98);
        }

        /* Adsterra Smartlink Bonus Banner */
        .bonus-banner {
            background: linear-gradient(90deg, #4c1d95, #312e81);
            border: 1px solid #7c3aed;
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bonus-btn {
            background-color: #facc15;
            color: #000000;
            border: none;
            font-weight: 800;
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div>
            <span class="brand-badge">AI BOT</span>
            <span class="brand-title">PENALTY PREDICTOR</span>
        </div>
        <div class="balance-box">
            <select id="currency-select" onchange="window.changeCurrency()" class="currency-select">
                <option value="NGN">NGN (₦)</option>
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="GBP">GBP (£)</option>
                <option value="GHS">GHS (GH₵)</option>
                <option value="KES">KES (KSh)</option>
                <option value="ZAR">ZAR (R)</option>
            </select>
            <span id="user-balance" class="balance-amount">3,305.17</span>
        </div>
    </div>

    <!-- Container -->
    <div class="container">
        
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-left">
                <div class="status-dot"></div>
                <span>AI Predictor Engine:</span>
            </div>
            <div class="confidence-tag">HIGH ACCURACY (84.2%)</div>
        </div>

        <!-- Pitch & Goal Grid -->
        <div class="pitch-arena">
            
            <div class="matchup-badge">
                <span class="badge-ai">PREDICTOR</span>
                <span class="vs-tag">VS</span>
                <span class="flag-tag">🌐</span>
            </div>

            <div class="goal-frame">
                <!-- Goalkeeper -->
                <div id="goalkeeper" class="keeper">
                    <div class="keeper-gloves">
                        <span>🥊</span>
                        <span>🥊</span>
                    </div>
                    <div class="keeper-body">GK</div>
                </div>

                <!-- 3x5 Interactive Target Grid (15 Spots total) -->
                <div class="grid-3x5">
                    <button onclick="window.shootPenalty(1)" class="target-btn">🎯 82%</button>
                    <button onclick="window.shootPenalty(2)" class="target-btn">🎯 76%</button>
                    <button onclick="window.shootPenalty(3)" class="target-btn">🎯 89%</button>
                    <button onclick="window.shootPenalty(4)" class="target-btn">🎯 74%</button>
                    <button onclick="window.shootPenalty(5)" class="target-btn">🎯 85%</button>

                    <button onclick="window.shootPenalty(6)" class="target-btn">🎯 79%</button>
                    <button onclick="window.shootPenalty(7)" class="target-btn">🎯 88%</button>
                    <button onclick="window.shootPenalty(8)" class="target-btn">🎯 91%</button>
                    <button onclick="window.shootPenalty(9)" class="target-btn">🎯 86%</button>
                    <button onclick="window.shootPenalty(10)" class="target-btn">🎯 80%</button>

                    <button onclick="window.shootPenalty(11)" class="target-btn">🎯 84%</button>
                    <button onclick="window.shootPenalty(12)" class="target-btn">🎯 78%</button>
                    <button onclick="window.shootPenalty(13)" class="target-btn">🎯 87%</button>
                    <button onclick="window.shootPenalty(14)" class="target-btn">🎯 81%</button>
                    <button onclick="window.shootPenalty(15)" class="target-btn">🎯 83%</button>
                </div>
            </div>

            <!-- Football Spot -->
            <div class="ball-area">
                <div id="football" class="football">⚽</div>
            </div>
        </div>

        <!-- Multipliers -->
        <div class="mult-grid">
            <div id="mult-1" onclick="window.selectMultiplier(1.76)" class="mult-card active">
                <div class="mult-label">SAFE SHOT</div>
                <div class="mult-val">1.76x</div>
            </div>
            <div id="mult-2" onclick="window.selectMultiplier(3.30)" class="mult-card">
                <div class="mult-label">BALANCED</div>
                <div class="mult-val">3.30x</div>
            </div>
            <div id="mult-3" onclick="window.selectMultiplier(7.08)" class="mult-card">
                <div class="mult-label">HIGH ODDS</div>
                <div class="mult-val">7.08x</div>
            </div>
        </div>

        <!-- Betting Controls -->
        <div class="bet-box">
            <div class="bet-input-row">
                <div class="input-wrapper">
                    <input id="bet-input" type="number" value="50.00" class="bet-input">
                    <span id="currency-label" style="font-size: 11px; color: #94a3b8; font-weight: 700;">NGN</span>
                </div>
                <button onclick="window.adjustBet(0.5)" class="btn-quick">/2</button>
                <button onclick="window.adjustBet(2.0)" class="btn-quick">x2</button>
            </div>

            <button onclick="window.randomShoot()" id="auto-kick-btn" class="btn-shoot">⚡ AUTO-PREDICT KICK</button>
        </div>

        <!-- Adsterra Smartlink Monetization Banner -->
        <div class="bonus-banner">
            <div>
                <div id="bonus-banner-title" style="font-size: 11px; font-weight: 800; color: #ffffff;">GET +5,000 NGN FREE</div>
                <div style="font-size: 9px; color: #cbd5e1;">Click offer link to claim coins</div>
            </div>
            <button onclick="window.triggerSmartlink(true)" class="bonus-btn">CLAIM NOW</button>
        </div>

    </div>

    <script>
        // Adsterra Smartlink URL
        window.ADSTERRA_SMARTLINK = "https://asiafilm.org/4/bd80344d93bc26083f8b20a55302a626";

        window.userBalance = 3305.17;
        window.selectedMultiplier = 1.76;
        window.isShooting = false;
        window.currentCurrency = "NGN";

        window.changeCurrency = function() {
            const sel = document.getElementById('currency-select');
            window.currentCurrency = sel.value;
            document.getElementById('currency-label').innerText = window.currentCurrency;
            document.getElementById('bonus-banner-title').innerText = "GET +5,000 " + window.currentCurrency + " FREE";
            window.updateBalance();
        };

        window.triggerSmartlink = function(rewardUser = false) {
            window.open(window.ADSTERRA_SMARTLINK, '_blank');
            if (rewardUser) {
                // Immediately credit reward upon clicking bonus link
                window.userBalance += 5000;
                window.updateBalance();
                alert("🎉 +5,000 " + window.currentCurrency + " Free Bonus Credited!");
            }
        };

        window.adjustBet = function(factor) {
            const input = document.getElementById('bet-input');
            let val = parseFloat(input.value) || 50.00;
            val = Math.max(10, val * factor);
            input.value = val.toFixed(2);
        };

        window.selectMultiplier = function(mult) {
            window.selectedMultiplier = mult;
            document.getElementById('mult-1').className = 'mult-card' + (mult === 1.76 ? ' active' : '');
            document.getElementById('mult-2').className = 'mult-card' + (mult === 3.30 ? ' active' : '');
            document.getElementById('mult-3').className = 'mult-card' + (mult === 7.08 ? ' active' : '');
        };

        window.updateBalance = function() {
            document.getElementById('user-balance').innerText = window.userBalance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        window.shootPenalty = function(targetIndex) {
            if (window.isShooting) return;

            const betInput = document.getElementById('bet-input');
            const betVal = parseFloat(betInput.value) || 50.00;

            if (window.userBalance < betVal) {
                alert('Insufficient Balance! Click "CLAIM NOW" to get +5,000 ' + window.currentCurrency + ' free.');
                return;
            }

            window.isShooting = true;
            window.userBalance -= betVal;
            window.updateBalance();

            const keeper = document.getElementById('goalkeeper');
            const ball = document.getElementById('football');

            // 3x5 Grid calculation
            const col = ((targetIndex - 1) % 5) - 2; // -2, -1, 0, 1, 2
            const row = Math.floor((targetIndex - 1) / 5); // 0, 1, 2

            const ballX = col * 35;
            const ballY = -(130 - (row * 30));

            const isWin = Math.random() > (window.selectedMultiplier === 1.76 ? 0.3 : window.selectedMultiplier === 3.30 ? 0.5 : 0.7);

            // Animate ball
            ball.style.transform = `translate(calc(-50% + ${ballX}px), ${ballY}px) scale(0.6)`;

            // Animate keeper
            const keeperX = isWin ? (col > 0 ? -35 : 35) : ballX;
            keeper.style.transform = `translate(calc(-50% + ${keeperX}px), -50%)`;

            setTimeout(() => {
                if (isWin) {
                    window.userBalance += (betVal * window.selectedMultiplier);
                    window.updateBalance();
                }

                // Reset positions after shot animation
                setTimeout(() => {
                    ball.style.transform = 'translateX(-50%)';
                    keeper.style.transform = 'translate(-50%, -50%)';
                    window.isShooting = false;

                    // Automatically trigger Smartlink after every penalty round
                    window.triggerSmartlink(false);
                }, 600);
            }, 500);
        };

        window.randomShoot = function() {
            if (window.isShooting) return;
            const randomTarget = Math.floor(Math.random() * 15) + 1;
            window.shootPenalty(randomTarget);
        };
    </script>
</body>
</html>
